name: Weekly template refresh

on:
  schedule:
    - cron: '0 12 * * 1'  # Mondays at 12:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Run refresh
        run: node scripts/refresh.mjs
      - name: Run test suite
        # In v0.1 the install runs `npm create cloudflare@latest` which makes
        # outbound network calls — this job verifies the harness end-to-end.
        run: node scripts/test.mjs
      - name: Commit + push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'supertools-bot'
            git config user.email 'bot@users.noreply.github.com'
            git add -A
            git commit -m "auto: weekly template refresh"
            git push
          fi
